name: C2 Cleanup Shell Authority

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - scripts/c2-cleanup-shell-authority.mjs
      - .github/workflows/c2-cleanup-shell-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove legacy shell authorities
        run: node scripts/c2-cleanup-shell-authority.mjs
      - name: Remove one-shot assets
        run: |
          rm scripts/c2-cleanup-shell-authority.mjs
          rm .github/workflows/c2-cleanup-shell-authority.yml
      - name: Commit C2 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/scada-editor/ScadaEditorPage.tsx src/features/component-library/ComponentEditorPage.tsx src/styles.css src/styles/ui-foundation.css src/ui/ui-primitives.css scripts/c2-cleanup-shell-authority.mjs .github/workflows/c2-cleanup-shell-authority.yml
          git commit -m "refactor: remove legacy editor shell authorities"
          git push origin HEAD:refactor/ui-c2-studio-shell
