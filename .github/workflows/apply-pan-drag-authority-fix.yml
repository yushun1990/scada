name: Apply pan and drag interaction fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pan-capture-and-drag-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply event-model fixes and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/SceneRenderer.tsx')
          text = path.read_text()

          old_type = """type PanSession = {
            startPointer: Point
            startTransform: ViewportTransform
          }"""
          old_type = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_type.splitlines())
          new_type = """type PanSession = {
            startClientPointer: Point
            startTransform: ViewportTransform
          }"""
          new_type = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_type.splitlines())
          if old_type not in text:
              raise RuntimeError('PanSession shape not found')
          text = text.replace(old_type, new_type, 1)

          pan_start = text.index('  function beginPan(')
          pan_end = text.index('  function setStageCursor(', pan_start)
          new_pan = """  function beginPan(nativeEvent: Event) {
            const mouseEvent = nativeEvent as MouseEvent
          
            if (panSessionRef.current) {
              finishPan()
            }
          
            nativeEvent.preventDefault()
            cancelPointerInteraction()
            cancelReconnectSession()
            panSessionRef.current = {
              startClientPointer: {
                x: mouseEvent.clientX,
                y: mouseEvent.clientY,
              },
              startTransform: { ...viewportTransformRef.current },
            }
            window.addEventListener('mousemove', handleWindowPanMove)
            window.addEventListener('mouseup', handleWindowPanEnd)
            window.addEventListener('blur', handleWindowPanEnd)
            setStageCursor('grabbing')
            return true
          }
          
          function updatePan(clientPointer: Point) {
            const session = panSessionRef.current
          
            if (!session) {
              return false
            }
          
            applyViewportTransform({
              ...session.startTransform,
              x:
                session.startTransform.x +
                clientPointer.x -
                session.startClientPointer.x,
              y:
                session.startTransform.y +
                clientPointer.y -
                session.startClientPointer.y,
            })
            return true
          }
          
          function handleWindowPanMove(event: MouseEvent) {
            updatePan({ x: event.clientX, y: event.clientY })
          }
          
          function handleWindowPanEnd() {
            finishPan()
          }
          
          function finishPan() {
            if (!panSessionRef.current) {
              return false
            }
          
            panSessionRef.current = null
            window.removeEventListener('mousemove', handleWindowPanMove)
            window.removeEventListener('mouseup', handleWindowPanEnd)
            window.removeEventListener('blur', handleWindowPanEnd)
            setViewportTransform({ ...viewportTransformRef.current })
            setStageCursor(spacePressedRef.current ? 'grab' : 'default')
            return true
          }
          
          """
          new_pan = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_pan.splitlines())
          text = text[:pan_start] + new_pan + text[pan_end:]

          schedule_start = text.index('  function scheduleDragMove(target: Konva.Node) {')
          schedule_end = text.index('  function cancelScheduledDrag()', schedule_start)
          new_schedule = """  function scheduleDragMove(target: Konva.Node) {
            // Konva changes the draggable node before onDragMove. Resolve snapping and
            // artboard bounds immediately in the same event. Delaying node correction
            // to requestAnimationFrame creates two competing positions and visible flicker.
            processDragMove(target)
          }
          
          """
          new_schedule = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_schedule.splitlines())
          text = text[:schedule_start] + new_schedule + text[schedule_end:]

          old_begin = '          if (stage && shouldStartPan(event.evt) && beginPan(stage, event.evt)) {'
          new_begin = '          if (shouldStartPan(event.evt) && beginPan(event.evt)) {'
          if old_begin not in text:
              raise RuntimeError('Stage pan start handler not found')
          text = text.replace(old_begin, new_begin, 1)

          old_update = """          if (updatePan(stage)) {
            return
          }"""
          new_update = """          if (
            panSessionRef.current &&
            updatePan({ x: event.evt.clientX, y: event.evt.clientY })
          ) {
            return
          }"""
          if old_update not in text:
              raise RuntimeError('Stage pan move handler not found')
          text = text.replace(old_update, new_update, 1)

          leave_start = text.index('        onMouseLeave={() => {')
          leave_end = text.index('        onDragStart=', leave_start)
          new_leave = """        onMouseLeave={() => {
            if (pointerStatusRef.current) {
              pointerStatusRef.current.textContent = 'X —  Y —'
            }
            if (!panSessionRef.current) {
              setStageCursor('default')
            }
            setHoveredPort(null)
            cancelReconnectSession()
            cancelPointerInteraction()
          }}
          """
          new_leave = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_leave.splitlines())
          text = text[:leave_start] + new_leave + text[leave_end:]

          path.write_text(text)
          PY

          npm ci
          npm run build
          npm run lint

          rm .github/workflows/apply-pan-drag-authority-fix.yml
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/renderer/SceneRenderer.tsx .github/workflows/apply-pan-drag-authority-fix.yml
          git commit -m "fix: make pan capture and drag positioning stable"
          git push origin "HEAD:${{ github.head_ref }}"
