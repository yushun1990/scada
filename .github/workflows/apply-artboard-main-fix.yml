name: Artboard patch payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - name: Payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # App: remove the visible "画板" prefix while preserving the select contents.
          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)<label className="scene-size-control" title="固定画板尺寸">\n'
              r'\s*<span>画板</span>\n'
              r'(?P<body>.*?)\n'
              r'(?P=indent)</label>',
              re.S,
          )
          match = pattern.search(app)
          if not match:
              raise RuntimeError('Unable to locate scene size control in src/App.tsx')
          indent = match.group('indent')
          body = match.group('body')
          replacement = (
              f'{indent}<div className="scene-size-control" title="固定画板尺寸">\n'
              f'{body}\n'
              f'{indent}</div>'
          )
          app_path.write_text(app[:match.start()] + replacement + app[match.end():])

          # CSS: replace the size-control block as one delimited section.
          css_path = Path('src/workbench.css')
          css = css_path.read_text()
          css_start = css.index('.scene-size-control {')
          css_end = css.index('.scene-size-control select:focus', css_start)
          compact_css = '''.scene-size-control {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            border: 1px solid #d7e0e9;
            border-radius: 6px;
            background: #ffffff;
            overflow: hidden;
          }

          .scene-size-control select {
            height: 28px;
            max-width: 176px;
            padding: 0 24px 0 9px;
            border: 0;
            color: #334155;
            background: #ffffff;
            font-size: 11px;
          }

          '''
          compact_css = re.sub(r'^          ', '', compact_css, flags=re.M)
          css = css[:css_start] + compact_css + css[css_end:]
          css = css.replace(
              '.konva-host {\n  background: #ffffff !important;\n}',
              '.konva-host {\n  background: #d9dee5 !important;\n}',
              1,
          )
          css_path.write_text(css)

          renderer_path = Path('src/renderer/SceneRenderer.tsx')
          renderer = renderer_path.read_text()

          # The workspace background is viewport-fixed now, so this visible-scene helper is obsolete.
          helper_start = renderer.index('// 计算当前视口在场景坐标系中可见的矩形区域。')
          helper_end = renderer.index('// 生成覆盖 [start, start+extent] 区间的网格坐标', helper_start)
          renderer = renderer[:helper_start] + renderer[helper_end:]
          renderer = re.sub(
              r'^\s*const visibleRect = getVisibleSceneRect\(viewport, viewportTransform\)\n',
              '',
              renderer,
              count=1,
              flags=re.M,
          )

          # Clamp the real Konva node synchronously before the RAF-batched snap/connection refresh.
          schedule_start = renderer.index('  function scheduleDragMove(target: Konva.Node) {')
          pending_marker = '    pendingDragTargetRef.current = target\n'
          pending_at = renderer.index(pending_marker, schedule_start)
          clamp_block = '''    const session = dragSessionRef.current
              const draggedTransform = session?.initialTransforms[session.nodeId]

              // Konva updates the dragged node before onDragMove. Clamp the real node
              // immediately so no frame can render any part outside the fixed artboard.
              if (session && draggedTransform) {
                const rawDeltaX = target.x() - draggedTransform.x
                const rawDeltaY = target.y() - draggedTransform.y
                const boundedDeltaX = Math.min(
                  scene.width - session.initialBounds.right,
                  Math.max(-session.initialBounds.left, rawDeltaX),
                )
                const boundedDeltaY = Math.min(
                  scene.height - session.initialBounds.bottom,
                  Math.max(-session.initialBounds.top, rawDeltaY),
                )

                target.position({
                  x: draggedTransform.x + boundedDeltaX,
                  y: draggedTransform.y + boundedDeltaY,
                })
              }

          '''
          clamp_block = re.sub(r'^              ', '', clamp_block, flags=re.M)
          renderer = renderer[:pending_at] + clamp_block + renderer[pending_at:]

          # Keep the workspace gray in viewport coordinates; only the artboard group pans/zooms.
          layer_marker = '        <Layer ref={staticLayerRef} listening={false}>\n'
          layer_at = renderer.index(layer_marker)
          fixed_background = '''          <Rect
              x={0}
              y={0}
              width={viewport.width}
              height={viewport.height}
              fill="#d9dee5"
              listening={false}
            />
          '''
          fixed_background = re.sub(r'^          ', '', fixed_background, flags=re.M)
          renderer = (
              renderer[:layer_at + len(layer_marker)]
              + fixed_background
              + renderer[layer_at + len(layer_marker):]
          )

          visible_rect_token = '            x={visibleRect.left}\n'
          token_at = renderer.index(visible_rect_token, layer_at)
          rect_start = renderer.rfind('          <Rect\n', layer_at, token_at)
          rect_end = renderer.index('          />\n', token_at) + len('          />\n')
          renderer = renderer[:rect_start] + renderer[rect_end:]
          renderer_path.write_text(renderer)
          PY

          npm ci
          npm run build
          npm run lint

          rm -f .github/workflows/apply-artboard-main-fix.yml
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneRenderer.tsx src/workbench.css .github/workflows/apply-artboard-main-fix.yml
          git commit -m "fix: stabilize bounded artboard interactions"
          git push origin HEAD:main
