name: Fix M2.3 reconnect build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'agent/m23-endpoint-reconnect-ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix strict type boundaries
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = app.replace(
              "  type NodeTransform,\n  type SceneConnection,",
              "  type NodeTransform,\n  type PumpSceneNode,\n  type SceneConnection,",
              1,
          )
          app = app.replace(
              """  const selectedPumpNodes = scene.nodes.filter(
              (node) => selectedSubtreeIds.has(node.id) && isPumpNode(node),
            )""",
              """  const selectedPumpNodes = scene.nodes.filter(
              (node): node is PumpSceneNode =>
                selectedSubtreeIds.has(node.id) && isPumpNode(node),
            )""",
              1,
          )
          app_path.write_text(app)

          renderer_path = Path('src/renderer/SceneNodeRenderer.tsx')
          renderer = renderer_path.read_text()
          renderer = renderer.replace(
              ">(function SceneNodeRenderer(\n",
              ">(function SceneNodeRendererImpl(\n",
              1,
          )
          renderer_path.write_text(renderer)

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit verified fixes
        run: |
          rm .github/workflows/fix-m23-reconnect-build.yml
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneNodeRenderer.tsx .github/workflows/fix-m23-reconnect-build.yml
          git commit -m "fix: satisfy reconnect build type boundaries"
          git push origin "HEAD:${{ github.head_ref }}"
