name: Pages Browser Smoke

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox

      - name: Smoke deployed GitHub Pages
        env:
          SCADA_PAGES_URL: https://yushun1990.github.io/scada/
        run: |
          node scripts/pages-smoke.mjs
          node scripts/pages-animation-move-smoke.mjs
          node scripts/pages-animation-scale-smoke.mjs
          node scripts/pages-animation-fade-smoke.mjs
          node scripts/pages-animation-blink-smoke.mjs
          SCADA_BROWSER=chromium node scripts/pages-component-hit-smoke.mjs
          SCADA_BROWSER=firefox node scripts/pages-component-hit-smoke.mjs
          node scripts/pages-scada-geometry-smoke.mjs
          node scripts/pages-component-package-transfer-smoke.mjs
          node scripts/pages-scada-work-package-transfer-smoke.mjs
          node scripts/pages-reusable-component-packages-smoke.mjs
