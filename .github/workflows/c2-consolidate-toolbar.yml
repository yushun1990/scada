name: C2 Consolidate Toolbar

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - scripts/c2-consolidate-toolbar.mjs
      - .github/workflows/c2-consolidate-toolbar.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate editor toolbars
        run: node scripts/c2-consolidate-toolbar.mjs
      - name: Remove one-shot assets
        run: |
          rm scripts/c2-consolidate-toolbar.mjs
          rm .github/workflows/c2-consolidate-toolbar.yml
      - name: Commit toolbar migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/scada-editor/ScadaEditorPage.tsx src/features/component-library/ComponentEditorPage.tsx scripts/c2-consolidate-toolbar.mjs .github/workflows/c2-consolidate-toolbar.yml
          git commit -m "refactor: consolidate editor toolbars into StudioShell"
          git push origin HEAD:refactor/ui-c2-studio-shell
