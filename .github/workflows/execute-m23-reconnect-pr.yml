name: Execute M2.3 reconnect patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply and commit endpoint reconnect patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_WORKFLOW=.github/workflows/apply-m23-reconnect.yml
          EXECUTOR_WORKFLOW=.github/workflows/execute-m23-reconnect-pr.yml

          if [[ ! -f "$PATCH_WORKFLOW" ]]; then
            echo "Patch already applied on this branch."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-m23-reconnect.yml').read_text()
          start_marker = "        run: |\n"
          end_marker = "\n      - name: Commit generated patch"

          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Unable to locate embedded patch script')

          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = script.splitlines()
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )

          original_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)'''

          resilient_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)

              if count == 1:
                  return text.replace(old, new, 1)

              old_lines = old.splitlines()
              new_lines = new.splitlines()
              text_lines = text.splitlines()
              normalized_old = [line.lstrip(' ') for line in old_lines]
              candidates = []

              for start in range(0, len(text_lines) - len(old_lines) + 1):
                  candidate = text_lines[start:start + len(old_lines)]

                  if [line.lstrip(' ') for line in candidate] == normalized_old:
                      candidates.append(start)

              if len(candidates) != 1:
                  raise RuntimeError(
                      f"{label}: expected one whitespace-normalized match, "
                      f"found {len(candidates)}",
                  )

              start = candidates[0]
              actual_old = text_lines[start:start + len(old_lines)]

              def indentation(line: str) -> int:
                  return len(line) - len(line.lstrip(' '))

              old_tokens = [line.lstrip(' ') for line in old_lines]
              new_tokens = [line.lstrip(' ') for line in new_lines]
              matched_offsets = {}
              consumed_old = set()

              for new_index, token in enumerate(new_tokens):
                  for old_index, old_token in enumerate(old_tokens):
                      if old_index in consumed_old or token != old_token:
                          continue

                      consumed_old.add(old_index)
                      matched_offsets[new_index] = (
                          indentation(actual_old[old_index]) -
                          indentation(new_lines[new_index])
                      )
                      break

              adjusted = []

              for index, line in enumerate(new_lines):
                  if not line.strip():
                      adjusted.append('')
                      continue

                  if index in matched_offsets:
                      offset = matched_offsets[index]
                  elif matched_offsets:
                      nearest_index = min(
                          matched_offsets,
                          key=lambda matched: (abs(matched - index), matched > index),
                      )
                      offset = matched_offsets[nearest_index]
                  else:
                      offset = 0

                  adjusted_indent = max(0, indentation(line) + offset)
                  adjusted.append(' ' * adjusted_indent + line.lstrip(' '))

              replacement = adjusted
              text_lines[start:start + len(old_lines)] = replacement
              result = '\n'.join(text_lines)
              return result + ('\n' if text.endswith('\n') else '')'''

          if original_helper not in normalized:
              raise RuntimeError('Unable to replace embedded patch helper')

          normalized = normalized.replace(
              original_helper,
              resilient_helper,
              1,
          )
          exec(compile(normalized, 'm23-reconnect-patch.py', 'exec'))
          PY

          rm "$PATCH_WORKFLOW" "$EXECUTOR_WORKFLOW"
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneRenderer.tsx .github/workflows
          git commit -m "feat: reconnect visual connection endpoints"
          git push origin "HEAD:${{ github.head_ref }}"
