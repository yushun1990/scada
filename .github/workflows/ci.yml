name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply drag authority fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/SceneRenderer.tsx')
          text = path.read_text()

          if 'skipPositionNodeId?: string' not in text:
              text = text.replace('  const dragFrameRef = useRef<number | null>(null)\n', '', 1)
              text = text.replace('  const pendingDragTargetRef = useRef<Konva.Node | null>(null)\n', '', 1)

              preview_start = text.index('  function applyPreview(')
              preview_end = text.index('  function clearMarqueeSession()', preview_start)
              text = text[:preview_start] + '''  function applyPreview(
                updates: TransformUpdates,
                affectedNodeIds: ReadonlySet<string>,
                skipPositionNodeId?: string,
              ) {
                for (const [nodeId, transform] of Object.entries(updates)) {
                  if (nodeId === skipPositionNodeId) {
                    continue
                  }

                  nodeRefs.current.get(nodeId)?.position({
                    x: transform.x,
                    y: transform.y,
                  })
                }

                dragPreviewRef.current = updates
                refreshConnections(updates, affectedNodeIds)
                refreshSelectedConnectionHandles(updates)
                refreshPorts(updates, affectedNodeIds)
                refreshSelection(updates)
                drawDynamicLayer()
              }

''' + text[preview_end:]

              drag_start = text.index('  function handleDragStart(target: Konva.Node) {')
              drag_end = text.index('  function processTransformPreview() {', drag_start)
              text = text[:drag_start] + '''  function boundDragDelta(
                session: DragSession,
                delta: { x: number; y: number },
              ) {
                return {
                  x: Math.min(
                    scene.width - session.initialBounds.right,
                    Math.max(-session.initialBounds.left, delta.x),
                  ),
                  y: Math.min(
                    scene.height - session.initialBounds.bottom,
                    Math.max(-session.initialBounds.top, delta.y),
                  ),
                }
              }

              function createDragUpdates(
                session: DragSession,
                delta: { x: number; y: number },
              ): TransformUpdates {
                const updates: TransformUpdates = {}

                for (const nodeId of session.nodeIds) {
                  const transform = session.initialTransforms[nodeId]

                  if (!transform) {
                    continue
                  }

                  updates[nodeId] = {
                    ...transform,
                    x: transform.x + delta.x,
                    y: transform.y + delta.y,
                  }
                }

                return updates
              }

              function constrainActiveDragPosition(position: Point) {
                const session = dragSessionRef.current
                const draggedTransform = session?.initialTransforms[session.nodeId]
                const viewportTransform = viewportTransformRef.current

                if (!session || !draggedTransform || viewportTransform.scale === 0) {
                  return position
                }

                const scenePosition = {
                  x: (position.x - viewportTransform.x) / viewportTransform.scale,
                  y: (position.y - viewportTransform.y) / viewportTransform.scale,
                }
                const boundedDelta = boundDragDelta(session, {
                  x: scenePosition.x - draggedTransform.x,
                  y: scenePosition.y - draggedTransform.y,
                })

                return {
                  x:
                    viewportTransform.x +
                    (draggedTransform.x + boundedDelta.x) * viewportTransform.scale,
                  y:
                    viewportTransform.y +
                    (draggedTransform.y + boundedDelta.y) * viewportTransform.scale,
                }
              }

              function handleDragStart(target: Konva.Node) {
                if (mode !== 'editor') {
                  return
                }

                clearMarqueeSession()
                clearConnectionSession()
                setHoveredPort(null)
                const nodeId = findSceneNodeId(target)

                if (!nodeId) {
                  return
                }

                let nodeIds = pendingSelectionRef.current ?? selectedNodeIds

                if (!nodeIds.includes(nodeId)) {
                  nodeIds = [nodeId]
                  onSelectionChange(nodeIds)
                }

                nodeIds = nodeIds.filter((id) => {
                  const node = rootNodes.find((candidate) => candidate.id === id)
                  return node && !node.locked
                })

                const initialBounds = getSelectionBounds(scene, nodeIds)

                if (!initialBounds) {
                  pendingSelectionRef.current = null
                  return
                }

                const initialTransforms: TransformUpdates = {}

                for (const id of nodeIds) {
                  const node = rootNodes.find((candidate) => candidate.id === id)

                  if (node) {
                    initialTransforms[id] = { ...node.transform }
                  }
                }

                dragSessionRef.current = {
                  nodeId,
                  nodeIds,
                  affectedNodeIds: collectSubtreeIds(scene, nodeIds),
                  initialBounds,
                  initialTransforms,
                }
                target.dragBoundFunc(constrainActiveDragPosition)
                pendingSelectionRef.current = null
                dragPreviewRef.current = {}
                hideGuides()
              }

              function processDragMove(target: Konva.Node) {
                const session = dragSessionRef.current

                if (!session) {
                  return
                }

                const draggedTransform = session.initialTransforms[session.nodeId]

                if (!draggedTransform) {
                  return
                }

                const boundedDelta = boundDragDelta(session, {
                  x: target.x() - draggedTransform.x,
                  y: target.y() - draggedTransform.y,
                })
                const updates = createDragUpdates(session, boundedDelta)

                // The primary node remains owned by Konva while the pointer is down.
                // No snapping and no second .position() write for that node.
                applyPreview(updates, session.affectedNodeIds, session.nodeId)
              }

              function scheduleDragMove(target: Konva.Node) {
                processDragMove(target)
              }

              function cancelScheduledDrag() {
                // Drag movement no longer uses a requestAnimationFrame queue.
              }

              function handleDragEnd(target: Konva.Node) {
                const session = dragSessionRef.current
                const draggedTransform = session?.initialTransforms[session.nodeId]

                if (!session || !draggedTransform) {
                  pendingSelectionRef.current = null
                  dragSessionRef.current = null
                  dragPreviewRef.current = {}
                  hideGuides()
                  return
                }

                const rawDelta = boundDragDelta(session, {
                  x: target.x() - draggedTransform.x,
                  y: target.y() - draggedTransform.y,
                })
                const snapResult = computeSnap(
                  scene,
                  session.nodeIds,
                  session.initialBounds,
                  rawDelta,
                  {
                    ...snapSettings,
                    threshold:
                      snapSettings.threshold / viewportTransformRef.current.scale,
                  },
                )
                const finalDelta = boundDragDelta(session, snapResult.delta)
                const updates = createDragUpdates(session, finalDelta)

                // Snap once only after release, then commit the scene model.
                applyPreview(updates, session.affectedNodeIds)
                onTransformNodes(updates)

                pendingSelectionRef.current = null
                dragSessionRef.current = null
                dragPreviewRef.current = {}
                hideGuides()
              }

''' + text[drag_end:]
              path.write_text(text)
          PY

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Build
                  run: npm run build

                - name: Lint
                  run: npm run lint
          EOF
          sed -i 's/^          //' .github/workflows/ci.yml

          npm ci
          npm run build
          npm run lint

          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/renderer/SceneRenderer.tsx .github/workflows/ci.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "fix: keep drag position authoritative until release"
          git push origin HEAD:main
