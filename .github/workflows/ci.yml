name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply workbench viewport patch
        if: github.head_ref == 'agent/m0-m1-workbench-viewport'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-workbench-viewport.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if line.strip() == 'run: |') + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].startswith('      - name: Install dependencies'))
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          Path('/tmp/apply-workbench-viewport.py').write_text(source + '\n')
          PY
          python /tmp/apply-workbench-viewport.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit verified implementation
        if: github.head_ref == 'agent/m0-m1-workbench-viewport'
        shell: bash
        run: |
          rm .github/workflows/apply-workbench-viewport.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Build
                  run: npm run build

                - name: Lint
                  run: npm run lint
          YAML
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneRenderer.tsx src/editor/viewport.ts src/workbench.css .github/workflows
          git commit -m "feat: add workbench shell and viewport navigation"
          git push origin "HEAD:${{ github.head_ref }}"
