name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tune/component-default-and-min-size
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply zoom-aware minimum size fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/SceneRenderer.tsx')
          text = path.read_text()
          old = """              boundBoxFunc={(oldBox, newBox) => {
                if (
                  Math.abs(newBox.width) < minimumTransformWidth ||
                  Math.abs(newBox.height) < minimumTransformHeight
                ) {
                  return oldBox
                }

                const currentViewport = viewportTransformRef.current
"""
          new = """              boundBoxFunc={(oldBox, newBox) => {
                const currentViewport = viewportTransformRef.current
                const minimumBoxWidth = minimumTransformWidth * currentViewport.scale
                const minimumBoxHeight = minimumTransformHeight * currentViewport.scale

                if (
                  Math.abs(newBox.width) < minimumBoxWidth ||
                  Math.abs(newBox.height) < minimumBoxHeight
                ) {
                  return oldBox
                }

"""
          assert old in text, 'transformer minimum-size block not found'
          path.write_text(text.replace(old, new, 1))
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-component-size-fix.yml .ci-trigger

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make component minimum size independent of zoom"
          git push origin HEAD:tune/component-default-and-min-size
