name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Runtime model checks
        run: |
          npx --yes tsx scripts/check-visual-runtime.ts
          npx --yes tsx scripts/check-animation-runtime-adapters.ts
          npx --yes tsx scripts/check-animation-model.ts
          npx --yes tsx scripts/check-animation-fade-model.ts
          npx --yes tsx scripts/check-animation-blink-model.ts
          npx --yes tsx scripts/check-controlled-runtime-contract.ts
          npx --yes tsx scripts/check-controlled-runtime-session.ts
          npx --yes tsx scripts/check-controlled-script-protocol.ts
          npx --yes tsx scripts/check-controlled-script-engine-contract.ts
          npx --yes tsx scripts/check-scada-behavior-contract.ts
          npx --yes tsx scripts/check-scada-dsl.ts
          npx --yes tsx scripts/check-scada-dsl-semantics.ts
          npx --yes tsx scripts/check-scada-dsl-analysis.ts
          npx --yes tsx scripts/check-scada-dsl-runtime.ts
          npx --yes tsx scripts/check-scada-dsl-propagation-session.ts
          npx --yes tsx scripts/check-scada-dsl-propagation-rollback.ts
          npx --yes tsx scripts/check-scada-dsl-hardening.ts
          npx --yes tsx scripts/check-preview-component-state.ts
          npx --yes tsx scripts/check-preview-scada-integration.ts
          npx --yes tsx scripts/check-typed-action-event-contract.ts
          npx --yes tsx scripts/check-scada-semantics-persistence.ts
          npx --yes tsx scripts/check-storage-repositories.ts
          npx --yes tsx scripts/check-local-storage-migration.ts
          npx --yes tsx scripts/check-user-component-activation.ts

      - name: Lint
        run: npm run lint
