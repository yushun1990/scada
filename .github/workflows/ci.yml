name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Runtime model checks
        run: |
          npx --yes tsx scripts/check-visual-runtime.ts
          npx --yes tsx scripts/check-animation-runtime-adapters.ts
          npx --yes tsx scripts/check-animation-model.ts
          npx --yes tsx scripts/check-animation-fade-model.ts
          npx --yes tsx scripts/check-animation-blink-model.ts
          npx --yes tsx scripts/check-controlled-runtime-contract.ts
          npx --yes tsx scripts/check-controlled-runtime-session.ts
          npx --yes tsx scripts/check-controlled-script-protocol.ts
          npx --yes tsx scripts/check-controlled-script-engine-contract.ts
          npx --yes tsx scripts/check-scada-behavior-contract.ts
          npx --yes tsx scripts/check-scada-dsl.ts
          npx --yes tsx scripts/check-scada-dsl-semantics.ts
          npx --yes tsx scripts/check-scada-dsl-analysis.ts
          npx --yes tsx scripts/check-scada-dsl-runtime.ts
          npx --yes tsx scripts/check-scada-dsl-propagation-session.ts
          npx --yes tsx scripts/check-scada-dsl-propagation-rollback.ts
          npx --yes tsx scripts/check-scada-dsl-hardening.ts
          npx --yes tsx scripts/check-preview-component-state.ts
          npx --yes tsx scripts/check-preview-scada-integration.ts
          npx --yes tsx scripts/check-typed-action-event-contract.ts
          npx --yes tsx scripts/check-scada-semantics-persistence.ts
          npx --yes tsx scripts/check-storage-repositories.ts
          npx --yes tsx scripts/check-local-storage-migration.ts
          npx --yes tsx scripts/check-user-component-activation.ts
          npx --yes tsx scripts/check-distributable-component-package.ts
          npx --yes tsx scripts/check-component-package-transfer.ts
          npx --yes tsx scripts/check-runtime-adapter-lifecycle.ts
          npx --yes tsx scripts/check-reusable-component-packages.ts
          npx --yes tsx scripts/check-component-publication-contract.ts
          npx --yes tsx scripts/check-remote-component-repository.ts
          npx --yes tsx scripts/check-remote-component-installation.ts
          npx --yes tsx scripts/check-component-publication-client.ts
          node scripts/check-server-publication-contract.mjs
          node --check server/src/publication-auth.js
          node --check server/src/index.js

      - name: Lint
        run: npm run lint

  publication-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scada
          POSTGRES_PASSWORD: scada
          POSTGRES_DB: scada
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scada -d scada"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install --prefix server

      - name: Verify immutable publication API
        env:
          DATABASE_URL: postgresql://scada:scada@127.0.0.1:5432/scada
          SCADA_ADMIN_TOKEN: ci-publication-token
          SCADA_PUBLISH_USERNAME: ci-author
          SCADA_PUBLISH_PASSWORD: ci-author-password
          SCADA_SESSION_COOKIE_SECURE: 'false'
          SCADA_SESSION_COOKIE_SAMESITE: Lax
          HOST: 127.0.0.1
          PORT: 3100
          PUBLICATION_API_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          node server/src/index.js > /tmp/scada-publication-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/scada-publication-api.log
            exit 1
          fi

          node scripts/check-publication-api.mjs