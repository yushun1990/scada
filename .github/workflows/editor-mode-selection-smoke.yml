name: Editor Mode Selection Browser Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/scada-editor/**'
      - 'src/renderer/**'
      - 'src/editor/**'
      - 'src/ui/**'
      - 'scripts/pages-editor-mode-selection-smoke.mjs'
      - 'scripts/pages-scene-fixture-storage.mjs'
      - '.github/workflows/editor-mode-selection-smoke.yml'
      - 'package*.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: editor-mode-selection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the proposed revision
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm ci
          npm run build 2>&1 | tee artifacts/editor-mode-selection-build.log
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify Preview and selection scope
        env:
          SCADA_PAGES_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/editor-mode-selection-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$SCADA_PAGES_URL" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/editor-mode-selection-preview.log | tee artifacts/editor-mode-selection-browser.log
            exit 1
          fi
          node scripts/pages-editor-mode-selection-smoke.mjs 2>&1 | tee artifacts/editor-mode-selection-browser.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-mode-selection-evidence
          path: artifacts/*
          if-no-files-found: ignore
