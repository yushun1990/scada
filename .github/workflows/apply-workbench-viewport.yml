              ? '连线模式'
              : '编辑模式'
            : '预览模式'}
        </span>
        {selectedConnectionId ? (
          <code>
            {selectedConnection?.routing ?? 'connection'} · 拖动端点重连
          </code>
        ) : selectedNodeIds.length > 1 ? (
          <code>{selectedNodeIds.length} selected</code>
        ) : primaryNode ? (
          <code>
            {isGroupNode(primaryNode) ? 'group · ' : ''}
