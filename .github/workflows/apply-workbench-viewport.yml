      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/apply-workbench-viewport.yml
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneRenderer.tsx src/editor/viewport.ts src/workbench.css .github/workflows
          git commit -m "feat: add workbench shell and viewport navigation"
          git push origin "HEAD:${{ github.head_ref }}"
