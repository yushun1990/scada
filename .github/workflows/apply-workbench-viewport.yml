name: Apply workbench viewport slice

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/m0-m1-workbench-viewport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply workbench and viewport implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = replace_once(
              app,
              "import './m2.css'",
              "import './m2.css'\nimport './workbench.css'",
              'workbench css import',
          )
          app = replace_once(
              app,
              "type InspectorTab = 'base' | 'properties' | 'actions' | 'events'",
              "type InspectorTab = 'base' | 'properties' | 'actions' | 'events'\ntype LeftDockTab = 'components' | 'layers' | 'assets'",
              'left dock tab type',
          )
          app = replace_once(
              app,
              "  const [connectionMode, setConnectionMode] = useState(false)\n  const [message, setMessage] = useState('M2.3A 通用视觉锚点迁移已启用')",
              "  const [connectionMode, setConnectionMode] = useState(false)\n  const [panMode, setPanMode] = useState(false)\n  const [leftDockTab, setLeftDockTab] = useState<LeftDockTab>('components')\n  const [message, setMessage] = useState('M0/M1.1 编辑器工作台与视口导航已启用')",
              'workbench state',
          )

          helper_anchor = "  const commonVisible =\n    selectedNodes.length > 0 && selectedNodes.every((node) => node.visible)"
          helper_block = """  function activateSelectTool() {
    setMode('editor')
    setPanMode(false)
    setConnectionMode(false)
    setMessage('选择工具')
  }

  function activatePanTool() {
    setMode('editor')
    setPanMode(true)
    setConnectionMode(false)
    setMessage('平移工具 · 也可按住 Space 或使用鼠标中键')
  }

  function activateConnectionTool() {
    setMode('editor')
    setPanMode(false)
    setConnectionMode(true)
    setMessage('连线工具 · 拖动任意视觉锚点建立连接')
  }

  const commonVisible =
    selectedNodes.length > 0 && selectedNodes.every((node) => node.visible)"""
          app = replace_once(app, helper_anchor, helper_block, 'tool activation helpers')

          header_start = app.index('      <header className="editor-header">')
          header_end = app.index('      </header>', header_start) + len('      </header>')
          new_header = """      <header className="editor-header">
        <div className="brand-block">
          <strong>SCADA Editor</strong>
          <span>Generic composition workbench</span>
        </div>

        <nav className="editor-menu" aria-label="主菜单">
          {['文件', '编辑', '视图', '排列', '连接', '运行', '帮助'].map((item) => (
            <button key={item} type="button" tabIndex={-1}>{item}</button>
          ))}
        </nav>

        <div className="editor-toolbar" role="toolbar" aria-label="编辑工具栏">
          <div className="toolbar-group">
            <button
              type="button"
              className={`tool-button${!panMode && !connectionMode ? ' active' : ''}`}
              onClick={activateSelectTool}
              title="选择工具 (V)"
            >
              选择
            </button>
            <button
              type="button"
              className={`tool-button${panMode ? ' active' : ''}`}
              onClick={activatePanTool}
              title="平移工具 (H / Space)"
            >
              平移
            </button>
            <button
              type="button"
              className={`tool-button${connectionMode ? ' active' : ''}`}
              onClick={activateConnectionTool}
              title="连线工具 (C)"
            >
              连线
            </button>
          </div>

          <div className="toolbar-group">
            <button type="button" className="tool-button" disabled title="M2.1 实现撤销">撤销</button>
            <button type="button" className="tool-button" disabled title="M2.1 实现重做">重做</button>
          </div>

          <div className="toolbar-group">
            <button
              type="button"
              className="tool-button"
              disabled={selectedNodes.length === 0}
              onClick={duplicateSelectedNodes}
            >
              复制
            </button>
            <button
              type="button"
              className="tool-button"
              disabled={!hasSelection}
              onClick={deleteSelection}
            >
              删除
            </button>
            <button
              type="button"
              className="tool-button optional-tool"
              disabled={!canGroup}
              onClick={groupSelectedNodes}
            >
              组合
            </button>
            <button
              type="button"
              className="tool-button optional-tool"
              disabled={!canUngroup}
              onClick={ungroupSelectedNode}
            >
              拆分
            </button>
          </div>

          <div className="toolbar-group">
            <button type="button" className="tool-button" onClick={saveScene}>保存</button>
            <button type="button" className="tool-button optional-tool" onClick={exportScene}>导出</button>
          </div>
        </div>

        <div className="header-actions">
          <span className="header-message">{message}</span>
          <div className="mode-switch" role="group" aria-label="编辑器模式">
            <button
              type="button"
              className={mode === 'editor' ? 'active' : ''}
              onClick={activateSelectTool}
            >
              编辑
            </button>
            <button
              type="button"
              className={mode === 'preview' ? 'active' : ''}
              onClick={() => {
                setMode('preview')
                setPanMode(false)
                setConnectionMode(false)
                setSelectedNodeIds([])
                setSelectedConnectionId(null)
              }}
            >
              预览
            </button>
          </div>
        </div>
      </header>"""
          app = app[:header_start] + new_header + app[header_end:]

          app = replace_once(
              app,
              '        <aside className="component-panel">\n          <div className="panel-title">组件</div>',
              '''        <aside className="component-panel">
          <div className="dock-tabs" role="tablist" aria-label="左侧工作区">
            {([
              ['components', '组件'],
              ['layers', '图层'],
              ['assets', '资源'],
            ] as Array<[LeftDockTab, string]>).map(([tab, label]) => (
              <button
                key={tab}
                type="button"
                className={leftDockTab === tab ? 'active' : ''}
                onClick={() => setLeftDockTab(tab)}
              >
                {label}
              </button>
            ))}
          </div>

          <div className="dock-content" hidden={leftDockTab !== 'components'}>
          <div className="panel-title">组件</div>''',
              'left dock opening',
          )
          app = replace_once(
              app,
              '''          <div className="milestone-card">
            <strong>M2.3A 当前切片</strong>
            <span>每个普通图片节点提供 17 个中性锚点</span>
            <span>连线选择、删除与样式设置</span>
            <span>起点和终点拖拽重连</span>
            <span>组合和变换后端点自动跟随</span>
          </div>
        </aside>''',
              '''          <div className="milestone-card">
            <strong>M0 / M1.1 当前切片</strong>
            <span>桌面编辑器工作台外壳</span>
            <span>无限工作区与固定场景画板</span>
            <span>缩放、平移、100% 与适应场景</span>
            <span>场景坐标与视口坐标分离</span>
          </div>
          </div>

          {leftDockTab === 'layers' && (
            <div className="dock-placeholder">
              <strong>图层树将在 M2.4 实现</strong>
              <span>当前组合层级已经持久化；下一阶段会加入排序、锁定、显隐和进入组合编辑。</span>
            </div>
          )}

          {leftDockTab === 'assets' && (
            <div className="dock-placeholder">
              <strong>资源库将在 M4.2 实现</strong>
              <span>用于管理项目图片和 SVG，并支持拖入场景和资源替换。</span>
            </div>
          )}
        </aside>''',
              'left dock closing',
          )

          app = replace_once(
              app,
              '''            onClick={() => {
              setMode('editor')
              setConnectionMode((current) => !current)
            }}''',
              '''            onClick={() => {
              if (connectionMode) {
                activateSelectTool()
              } else {
                activateConnectionTool()
              }
            }}''',
              'legacy connection button',
          )
          app = replace_once(
              app,
              '            connectionMode={connectionMode}\n            snapSettings={snapSettings}',
              '            connectionMode={connectionMode}\n            panMode={panMode}\n            snapSettings={snapSettings}',
              'pan mode renderer prop',
          )
          app = replace_once(
              app,
              '''              {selectedNodes.length === 0 ? (
                <p className="empty-selection">请选择组件、组合或连线。</p>
              ) : selectedNodes.length > 1 ? (''',
              '''              {selectedNodes.length === 0 ? (
                <div className="scene-inspector-summary">
                  <div><span>场景</span><code>{scene.name}</code></div>
                  <div><span>尺寸</span><code>{scene.width} × {scene.height}</code></div>
                  <div><span>背景</span><code>{scene.background}</code></div>
                  <div><span>下一切片</span><code>M1.2 场景设置</code></div>
                </div>
              ) : selectedNodes.length > 1 ? (''',
              'scene inspector summary',
          )
          app_path.write_text(app)

          renderer_path = Path('src/renderer/SceneRenderer.tsx')
          renderer = renderer_path.read_text()
          renderer = replace_once(
              renderer,
              "import { SceneNodeRenderer } from './SceneNodeRenderer'",
              """import { SceneNodeRenderer } from './SceneNodeRenderer'
import {
  centerSceneAtScale,
  fitSceneToViewport,
  isPointInsideScene,
  scenePointFromViewport,
  VIEWPORT_ZOOM_FACTOR,
  type ViewportTransform,
} from '../editor/viewport'""",
              'viewport imports',
          )
          renderer = replace_once(
              renderer,
              '  connectionMode: boolean\n  snapSettings: SnapSettings',
              '  connectionMode: boolean\n  panMode: boolean\n  snapSettings: SnapSettings',
              'pan mode prop type',
          )
          renderer = replace_once(
              renderer,
              '''type Point = {
  x: number
  y: number
}

type MarqueeState''',
              '''type Point = {
  x: number
  y: number
}

type PanSession = {
  startPointer: Point
  startTransform: ViewportTransform
}

type MarqueeState''',
              'pan session type',
          )
          renderer = replace_once(
              renderer,
              '''function hasSelectionModifier(event: Event) {''',
              '''function isEditableTarget(target: EventTarget | null) {
  return (
    target instanceof HTMLInputElement ||
    target instanceof HTMLTextAreaElement ||
    target instanceof HTMLSelectElement ||
    (target instanceof HTMLElement && target.isContentEditable)
  )
}

function hasSelectionModifier(event: Event) {''',
              'editable target helper',
          )
          renderer = replace_once(
              renderer,
              '''  selectedConnectionId,
  connectionMode,
  snapSettings,''',
              '''  selectedConnectionId,
  connectionMode,
  panMode,
  snapSettings,''',
              'pan mode destructuring',
          )
          renderer = replace_once(
              renderer,
              '''  const transformerRef = useRef<Konva.Transformer>(null)
  const dynamicLayerRef = useRef<Konva.Layer>(null)''',
              '''  const transformerRef = useRef<Konva.Transformer>(null)
  const staticLayerRef = useRef<Konva.Layer>(null)
  const staticViewportGroupRef = useRef<Konva.Group>(null)
  const dynamicViewportGroupRef = useRef<Konva.Group>(null)
  const dynamicLayerRef = useRef<Konva.Layer>(null)''',
              'viewport layer refs',
          )
          renderer = replace_once(
              renderer,
              '''  const reconnectCandidateKeyRef = useRef<string | null>(null)
  const [viewport, setViewport] = useState({ width: 960, height: 640 })''',
              '''  const reconnectCandidateKeyRef = useRef<string | null>(null)
  const panSessionRef = useRef<PanSession | null>(null)
  const spacePressedRef = useRef(false)
  const viewportInitializedRef = useRef(false)
  const viewportTransformRef = useRef<ViewportTransform>({ x: 0, y: 0, scale: 1 })
  const pointerStatusRef = useRef<HTMLSpanElement>(null)
  const [viewport, setViewport] = useState({ width: 960, height: 640 })
  const [viewportTransform, setViewportTransform] = useState<ViewportTransform>({
    x: 0,
    y: 0,
    scale: 1,
  })''',
              'viewport state and refs',
          )

          resize_effect_end = '''    observer.observe(container)
    return () => observer.disconnect()
  }, [])
'''
          viewport_effects = '''    observer.observe(container)
    return () => observer.disconnect()
  }, [])

  useEffect(() => {
    if (viewportInitializedRef.current) {
      return
    }

    viewportInitializedRef.current = true
    commitViewportTransform(
      fitSceneToViewport(viewport, { width: scene.width, height: scene.height }),
    )
  }, [viewport.width, viewport.height, scene.width, scene.height])

  useEffect(() => {
    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.code !== 'Space' || isEditableTarget(event.target)) {
        return
      }

      event.preventDefault()
      spacePressedRef.current = true
      setStageCursor('grab')
    }
    const handleKeyUp = (event: KeyboardEvent) => {
      if (event.code !== 'Space') {
        return
      }

      spacePressedRef.current = false
      if (!panSessionRef.current) {
        setStageCursor(panMode ? 'grab' : 'default')
      }
    }

    window.addEventListener('keydown', handleKeyDown)
    window.addEventListener('keyup', handleKeyUp)
    return () => {
      window.removeEventListener('keydown', handleKeyDown)
      window.removeEventListener('keyup', handleKeyUp)
    }
  }, [panMode])
'''
          renderer = replace_once(renderer, resize_effect_end, viewport_effects, 'viewport effects')

          draw_anchor = '''  function drawDynamicLayer() {
    dynamicLayerRef.current?.batchDraw()
  }
'''
          draw_replacement = '''  function drawDynamicLayer() {
    dynamicLayerRef.current?.batchDraw()
  }

  function drawViewportLayers() {
    staticLayerRef.current?.batchDraw()
    dynamicLayerRef.current?.batchDraw()
  }

  function applyViewportTransform(next: ViewportTransform) {
    viewportTransformRef.current = next
    staticViewportGroupRef.current?.setAttrs({
      x: next.x,
      y: next.y,
      scaleX: next.scale,
      scaleY: next.scale,
    })
    dynamicViewportGroupRef.current?.setAttrs({
      x: next.x,
      y: next.y,
      scaleX: next.scale,
      scaleY: next.scale,
    })
    drawViewportLayers()
  }

  function commitViewportTransform(next: ViewportTransform) {
    applyViewportTransform(next)
    setViewportTransform(next)
  }

  function getScenePointer(stage: Konva.Stage) {
    const pointer = stage.getPointerPosition()
    return pointer
      ? scenePointFromViewport(pointer, viewportTransformRef.current)
      : null
  }

  function updatePointerStatus(stage: Konva.Stage) {
    const point = getScenePointer(stage)
    const status = pointerStatusRef.current

    if (!status) {
      return
    }

    status.textContent = point && isPointInsideScene(point, scene)
      ? `X ${Math.round(point.x)}  Y ${Math.round(point.y)}`
      : 'X —  Y —'
  }

  function fitScene() {
    commitViewportTransform(
      fitSceneToViewport(viewport, { width: scene.width, height: scene.height }),
    )
  }

  function resetViewport() {
    commitViewportTransform(
      centerSceneAtScale(viewport, { width: scene.width, height: scene.height }, 1),
    )
  }

  function zoomAtViewportPoint(point: Point, requestedScale: number) {
    const current = viewportTransformRef.current
    const scenePoint = scenePointFromViewport(point, current)
    const nextScale = Math.min(8, Math.max(0.1, requestedScale))
    commitViewportTransform({
      x: point.x - scenePoint.x * nextScale,
      y: point.y - scenePoint.y * nextScale,
      scale: nextScale,
    })
  }

  function zoomBy(factor: number) {
    zoomAtViewportPoint(
      { x: viewport.width / 2, y: viewport.height / 2 },
      viewportTransformRef.current.scale * factor,
    )
  }

  function shouldStartPan(nativeEvent: Event) {
    const mouseEvent = nativeEvent as MouseEvent
    return panMode || spacePressedRef.current || mouseEvent.button === 1
  }

  function beginPan(stage: Konva.Stage, nativeEvent: Event) {
    const pointer = stage.getPointerPosition()

    if (!pointer) {
      return false
    }

    nativeEvent.preventDefault()
    cancelPointerInteraction()
    cancelReconnectSession()
    panSessionRef.current = {
      startPointer: pointer,
      startTransform: { ...viewportTransformRef.current },
    }
    setStageCursor('grabbing')
    return true
  }

  function updatePan(stage: Konva.Stage) {
    const session = panSessionRef.current
    const pointer = stage.getPointerPosition()

    if (!session || !pointer) {
      return false
    }

    applyViewportTransform({
      ...session.startTransform,
      x: session.startTransform.x + pointer.x - session.startPointer.x,
      y: session.startTransform.y + pointer.y - session.startPointer.y,
    })
    return true
  }

  function finishPan() {
    if (!panSessionRef.current) {
      return false
    }

    panSessionRef.current = null
    setViewportTransform({ ...viewportTransformRef.current })
    setStageCursor(panMode || spacePressedRef.current ? 'grab' : 'default')
    return true
  }
'''
          renderer = replace_once(renderer, draw_anchor, draw_replacement, 'viewport functions')

          renderer = renderer.replace('          vertical.position,\n          viewport.height,', '          vertical.position,\n          scene.height,')
          renderer = renderer.replace('          viewport.width,\n          horizontal.position,', '          scene.width,\n          horizontal.position,')
          renderer = replace_once(
              renderer,
              '''    const pointer = stage.getPointerPosition()

    if (!pointer) {
      return
    }

    pendingSelectionRef.current = null''',
              '''    const pointer = getScenePointer(stage)

    if (!pointer || !isPointInsideScene(pointer, scene)) {
      return
    }

    pendingSelectionRef.current = null''',
              'marquee start scene pointer',
          )
          renderer = replace_once(
              renderer,
              '''    const session = marqueeSessionRef.current
    const pointer = stage.getPointerPosition()

    if (!session || !pointer) {''',
              '''    const session = marqueeSessionRef.current
    const pointer = getScenePointer(stage)

    if (!session || !pointer) {''',
              'marquee move scene pointer',
          )
          renderer = replace_once(
              renderer,
              '''  function scheduleConnectionPreview(stage: Konva.Stage) {
    const pointer = stage.getPointerPosition()''',
              '''  function scheduleConnectionPreview(stage: Konva.Stage) {
    const pointer = getScenePointer(stage)''',
              'connection preview scene pointer',
          )
          renderer = replace_once(
              renderer,
              '''    const stage = handle.getStage()
    const pointer = stage?.getPointerPosition() ?? handle.position()''',
              '''    const stage = handle.getStage()
    const pointer = stage ? getScenePointer(stage) ?? handle.position() : handle.position()''',
              'reconnect scene pointer',
          )
          renderer = renderer.replace(
              '    let nearestDistanceSquared = RECONNECT_SNAP_RADIUS ** 2',
              '    let nearestDistanceSquared = (RECONNECT_SNAP_RADIUS / viewportTransformRef.current.scale) ** 2',
          )
          renderer = renderer.replace(
              '      Math.abs(pointer.x - session.start.x) >= MARQUEE_THRESHOLD ||\n      Math.abs(pointer.y - session.start.y) >= MARQUEE_THRESHOLD',
              '      Math.abs(pointer.x - session.start.x) >= MARQUEE_THRESHOLD / viewportTransformRef.current.scale ||\n      Math.abs(pointer.y - session.start.y) >= MARQUEE_THRESHOLD / viewportTransformRef.current.scale',
          )
          renderer = renderer.replace(
              '      snapSettings,\n    )',
              '      { ...snapSettings, threshold: snapSettings.threshold / viewportTransformRef.current.scale },\n    )',
              1,
          )

          renderer = replace_once(
              renderer,
              '''  const gridSize = Math.max(4, snapSettings.gridSize)
  const verticalGridLines = gridVisible
    ? Array.from(
        { length: Math.ceil(viewport.width / gridSize) + 1 },
        (_, index) => index * gridSize,
      )
    : []
  const horizontalGridLines = gridVisible
    ? Array.from(
        { length: Math.ceil(viewport.height / gridSize) + 1 },
        (_, index) => index * gridSize,
      )
    : []''',
              '''  const gridSize = Math.max(4, snapSettings.gridSize)
  const verticalGridLines = gridVisible
    ? Array.from(
        { length: Math.ceil(scene.width / gridSize) + 1 },
        (_, index) => index * gridSize,
      )
    : []
  const horizontalGridLines = gridVisible
    ? Array.from(
        { length: Math.ceil(scene.height / gridSize) + 1 },
        (_, index) => index * gridSize,
      )
    : []
  const visualControlScale = 1 / viewportTransform.scale''',
              'scene grid and visual scale',
          )
          renderer = replace_once(
              renderer,
              '''      className="konva-host"
      style={{ backgroundColor: scene.background }}''',
              '''      className="konva-host"''',
              'workspace background separation',
          )

          renderer = replace_once(
              renderer,
              '''        onMouseDown={(event) => {
          const handleRole = findConnectionHandleRole(event.target)''',
              '''        onWheel={(event) => {
          event.evt.preventDefault()
          const stage = event.target.getStage()
          const pointer = stage?.getPointerPosition()

          if (!pointer) {
            return
          }

          const factor = event.evt.deltaY > 0
            ? 1 / VIEWPORT_ZOOM_FACTOR
            : VIEWPORT_ZOOM_FACTOR
          zoomAtViewportPoint(
            pointer,
            viewportTransformRef.current.scale * factor,
          )
        }}
        onMouseDown={(event) => {
          const stage = event.target.getStage()

          if (stage && shouldStartPan(event.evt) && beginPan(stage, event.evt)) {
            return
          }

          const handleRole = findConnectionHandleRole(event.target)''',
              'stage wheel and pan start',
          )
          renderer = replace_once(
              renderer,
              '''        onMouseMove={(event) => {
          const stage = event.target.getStage()

          if (!stage) {
            return
          }

          if (connectionSessionRef.current) {''',
              '''        onMouseMove={(event) => {
          const stage = event.target.getStage()

          if (!stage) {
            return
          }

          updatePointerStatus(stage)

          if (updatePan(stage)) {
            return
          }

          if (connectionSessionRef.current) {''',
              'stage pan move',
          )
          renderer = replace_once(
              renderer,
              '        onMouseUp={(event) => handleStageMouseUp(event.target)}',
              '''        onMouseUp={(event) => {
          if (!finishPan()) {
            handleStageMouseUp(event.target)
          }
        }}''',
              'stage pan end',
          )
          renderer = replace_once(
              renderer,
              '''        onMouseLeave={() => {
          setStageCursor('default')''',
              '''        onMouseLeave={() => {
          finishPan()
          if (pointerStatusRef.current) {
            pointerStatusRef.current.textContent = 'X —  Y —'
          }
          setStageCursor(panMode ? 'grab' : 'default')''',
              'stage mouse leave',
          )

          renderer = replace_once(
              renderer,
              '''        <Layer listening={false}>
          <Rect
            width={viewport.width}
            height={viewport.height}
            fill={scene.background}
          />''',
              '''        <Layer ref={staticLayerRef} listening={false}>
          <Group
            ref={staticViewportGroupRef}
            x={viewportTransform.x}
            y={viewportTransform.y}
            scaleX={viewportTransform.scale}
            scaleY={viewportTransform.scale}
          >
          <Rect
            width={scene.width}
            height={scene.height}
            fill={scene.background}
            shadowColor="#0f172a"
            shadowBlur={20 * visualControlScale}
            shadowOpacity={0.2}
            shadowOffsetY={5 * visualControlScale}
          />''',
              'static viewport group',
          )
