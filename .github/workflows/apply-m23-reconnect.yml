        run: |
          rm .github/workflows/apply-m23-reconnect.yml
          git config user.name "scada-editor-bot"
          git config user.email "scada-editor-bot@users.noreply.github.com"
          git add src/App.tsx src/renderer/SceneRenderer.tsx .github/workflows/apply-m23-reconnect.yml
