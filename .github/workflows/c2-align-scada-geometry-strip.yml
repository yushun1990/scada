name: C2 Align SCADA Geometry Strip

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - .github/workflows/c2-align-scada-geometry-strip.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - name: Align SCADA geometry strip with shared Studio toolbar behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          scada = Path('src/features/scada-editor/ScadaEditorPage.tsx')
          text = scada.read_text()
          old = '''            <ToolbarGroup className="canvas-tool-group">\n              {alignButtons.map((item) => {'''
          new = '''            <ToolbarGroup className="canvas-tool-group scada-geometry-tool-group">\n              {alignButtons.map((item) => {'''
          if old not in text:
              raise SystemExit('SCADA geometry toolbar group insertion point not found')
          scada.write_text(text.replace(old, new, 1))

          css = Path('src/editor-toolbar-context.css')
          text = css.read_text()
          old = '''.studio-main-toolbar-content .component-geometry-tool-group {\n  flex: 0 1 auto;'''
          new = '''.studio-main-toolbar-content .component-geometry-tool-group,\n.studio-main-toolbar-content .scada-geometry-tool-group {\n  flex: 0 1 auto;'''
          if old not in text:
              raise SystemExit('shared geometry strip rule not found')
          text = text.replace(old, new, 1)
          old = '''.studio-main-toolbar-content .component-geometry-tool-group > button {\n  flex: 0 0 var(--ui-control-height);\n}'''
          new = '''.studio-main-toolbar-content .component-geometry-tool-group > button,\n.studio-main-toolbar-content .scada-geometry-tool-group > button {\n  flex: 0 0 var(--ui-control-height);\n}'''
          if old not in text:
              raise SystemExit('shared geometry button sizing rule not found')
          css.write_text(text.replace(old, new, 1))

          Path('.github/workflows/c2-align-scada-geometry-strip.yml').unlink()
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align SCADA geometry strip with Studio toolbar"
          git push origin HEAD:refactor/ui-c2-studio-shell
