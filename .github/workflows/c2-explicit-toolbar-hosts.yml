name: C2 Explicit Toolbar Hosts

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - scripts/c2-explicit-toolbar-hosts.mjs
      - .github/workflows/c2-explicit-toolbar-hosts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply explicit toolbar host migration
        run: node scripts/c2-explicit-toolbar-hosts.mjs
      - name: Remove obsolete C2 assets
        run: |
          rm scripts/c2-explicit-toolbar-hosts.mjs
          rm .github/workflows/c2-explicit-toolbar-hosts.yml
          rm src/component-editor-header.css
          rm src/features/component-library/component-canvas-toolbar.css
      - name: Commit explicit shell toolbar contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make StudioShell toolbar hosts explicit"
          git push origin HEAD:refactor/ui-c2-studio-shell
