name: Apply workspace refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/workspace-and-component-library
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refactor application structure
        shell: bash
        run: |
          mkdir -p src/features/scada-editor src/features/scada-works src/features/workspace src/features/component-library
          git mv src/App.tsx src/features/scada-editor/ScadaEditorPage.tsx

          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/scada-editor/ScadaEditorPage.tsx')
          text = path.read_text()

          replacements = {
              "import './m2.css'": "import '../../m2.css'",
              "import './workbench.css'": "import '../../workbench.css'",
              "from './scene/": "from '../../scene/",
              "from './renderer/": "from '../../renderer/",
              "from './components/": "from '../../components/",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          marker = "import {\n  hasDuplicateConnection,"
          assert marker in text
          text = text.replace(
              marker,
              "import { loadScadaScene, saveScadaScene } from '../scada-works/storage'\n" + marker,
              1,
          )

          constants_start = text.index("const STORAGE_KEY =")
          inspector_type = text.index("type InspectorTab", constants_start)
          text = text[:constants_start] + text[inspector_type:]

          saved_start = text.index("function getSavedScene()")
          app_start = text.index("function App()", saved_start)
          text = text[:saved_start] + text[app_start:]

          text = text.replace(
              "function App() {",
              "export function ScadaEditorPage({ workId }: { workId: string }) {",
              1,
          )
          text = text.replace(
              "const initialScene = loadInitialScene()",
              "const initialScene = loadScadaScene(workId)",
              1,
          )
          text = text.replace(
              "window.localStorage.setItem(STORAGE_KEY, JSON.stringify(scene))\n    setMessage('v4 场景已保存到浏览器')",
              "saveScadaScene(workId, scene)\n    setMessage('场景已保存')",
              1,
          )
          text = text.replace("export default App", "export default ScadaEditorPage", 1)

          for stale in ('STORAGE_KEY', 'loadInitialScene', 'getSavedScene', 'function App()'):
              assert stale not in text, stale
          assert "loadScadaScene(workId)" in text
          assert "saveScadaScene(workId, scene)" in text
          path.write_text(text)
          PY

          cat > src/features/scada-works/storage.ts <<'EOF'
          import { createDefaultScene, type SceneDocument } from '../../scene/model'
          import { parseSceneDocument } from '../../scene/validation'

          const WORKS_STORAGE_KEY = 'scada-editor-lab.works.v1'
          const SCENE_STORAGE_PREFIX = 'scada-editor-lab.work.'
          const LEGACY_SCENE_KEYS = [
            'scada-editor-lab.scene.v4',
            'scada-editor-lab.scene.v3',
            'scada-editor-lab.scene.v2',
            'scada-editor-lab.scene.v1',
          ]

          export type ScadaWorkSummary = {
            id: string
            name: string
            width: number
            height: number
            nodeCount: number
            connectionCount: number
            updatedAt: string
          }

          function createWorkId() {
            const suffix = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`
            return `work-${suffix}`
          }

          export function getScadaSceneStorageKey(workId: string) {
            return `${SCENE_STORAGE_PREFIX}${workId}.scene.v4`
          }

          function readWorks(): ScadaWorkSummary[] {
            const raw = window.localStorage.getItem(WORKS_STORAGE_KEY)

            if (!raw) {
              return []
            }

            try {
              const value = JSON.parse(raw)
              return Array.isArray(value) ? value : []
            } catch {
              return []
            }
          }

          function writeWorks(works: ScadaWorkSummary[]) {
            window.localStorage.setItem(WORKS_STORAGE_KEY, JSON.stringify(works))
          }

          function summarizeScene(
            workId: string,
            scene: SceneDocument,
            updatedAt = new Date().toISOString(),
          ): ScadaWorkSummary {
            return {
              id: workId,
              name: scene.name,
              width: scene.width,
              height: scene.height,
              nodeCount: scene.nodes.length,
              connectionCount: scene.connections.length,
              updatedAt,
            }
          }

          function loadLegacyScene() {
            for (const key of LEGACY_SCENE_KEYS) {
              const raw = window.localStorage.getItem(key)

              if (!raw) {
                continue
              }

              try {
                return parseSceneDocument(raw)
              } catch {
                // Try the next historical key.
              }
            }

            return null
          }

          function ensureInitialWork() {
            const existing = readWorks()

            if (existing.length > 0) {
              return existing
            }

            const scene = loadLegacyScene() ?? createDefaultScene()
            const workId = 'legacy'
            window.localStorage.setItem(
              getScadaSceneStorageKey(workId),
              JSON.stringify(scene),
            )
            const seeded = [summarizeScene(workId, scene)]
            writeWorks(seeded)
            return seeded
          }

          export function listScadaWorks() {
            return [...ensureInitialWork()].sort((left, right) =>
              right.updatedAt.localeCompare(left.updatedAt),
            )
          }

          export function loadScadaScene(workId: string): SceneDocument {
            const raw = window.localStorage.getItem(getScadaSceneStorageKey(workId))

            if (raw) {
              try {
                return parseSceneDocument(raw)
              } catch {
                // Fall through to a valid default scene.
              }
            }

            if (workId === 'legacy') {
              const legacy = loadLegacyScene()
              if (legacy) {
                return legacy
              }
            }

            const scene = createDefaultScene()
            scene.name = '未命名 SCADA'
            return scene
          }

          export function saveScadaScene(workId: string, scene: SceneDocument) {
            window.localStorage.setItem(
              getScadaSceneStorageKey(workId),
              JSON.stringify(scene),
            )

            const works = readWorks()
            const summary = summarizeScene(workId, scene)
            const index = works.findIndex((work) => work.id === workId)

            if (index >= 0) {
              works[index] = summary
            } else {
              works.push(summary)
            }

            writeWorks(works)
            return summary
          }

          export function createScadaWork() {
            const workId = createWorkId()
            const scene = createDefaultScene()
            scene.name = `SCADA 作品 ${listScadaWorks().length + 1}`
            return saveScadaScene(workId, scene)
          }
          EOF

          cat > src/features/component-library/storage.ts <<'EOF'
          const COMPONENTS_STORAGE_KEY = 'scada-editor-lab.components.v1'

          export type ComponentStatus = 'draft' | 'ready'

          export type ComponentDefinition = {
            id: string
            name: string
            type: string
            category: string
            description: string
            defaultWidth: number
            defaultHeight: number
            status: ComponentStatus
            renderCode: string
            updatedAt: string
            builtIn: boolean
          }

          const BUILT_IN_COMPONENTS: ComponentDefinition[] = [
            {
              id: 'builtin-pump-submersible',
              name: '潜水泵',
              type: 'pump.submersible',
              category: '设备',
              description: '当前编辑器内置的潜水泵视觉组件。',
              defaultWidth: 256,
              defaultHeight: 360,
              status: 'ready',
              renderCode: '// Built-in renderer: src/assets/pump.tsx / scene node renderer',
              updatedAt: '2026-08-07T00:00:00.000Z',
              builtIn: true,
            },
          ]

          function createComponentId() {
            const suffix = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`
            return `component-${suffix}`
          }

          function readCustomComponents(): ComponentDefinition[] {
            const raw = window.localStorage.getItem(COMPONENTS_STORAGE_KEY)

            if (!raw) {
              return []
            }

            try {
              const value = JSON.parse(raw)
              return Array.isArray(value) ? value : []
            } catch {
              return []
            }
          }

          function writeCustomComponents(components: ComponentDefinition[]) {
            window.localStorage.setItem(COMPONENTS_STORAGE_KEY, JSON.stringify(components))
          }

          export function listComponentDefinitions() {
            return [...BUILT_IN_COMPONENTS, ...readCustomComponents()].sort((left, right) =>
              left.builtIn === right.builtIn
                ? right.updatedAt.localeCompare(left.updatedAt)
                : left.builtIn
                  ? -1
                  : 1,
            )
          }

          export function getComponentDefinition(componentId: string) {
            return listComponentDefinitions().find((component) => component.id === componentId) ?? null
          }

          export function createComponentDraft(): ComponentDefinition {
            const suffix = Date.now().toString(36)
            return {
              id: createComponentId(),
              name: '新组件',
              type: `custom.component.${suffix}`,
              category: '自定义',
              description: '',
              defaultWidth: 160,
              defaultHeight: 120,
              status: 'draft',
              renderCode: `export function render(ctx) {\n  // TODO: 在这里实现组件视觉。\n}\n`,
              updatedAt: new Date().toISOString(),
              builtIn: false,
            }
          }

          export function saveComponentDefinition(component: ComponentDefinition) {
            if (component.builtIn) {
              throw new Error('内置组件当前不允许覆盖保存')
            }

            const next = {
              ...component,
              updatedAt: new Date().toISOString(),
            }
            const components = readCustomComponents()
            const index = components.findIndex((item) => item.id === next.id)

            if (index >= 0) {
              components[index] = next
            } else {
              components.push(next)
            }

            writeCustomComponents(components)
            return next
          }
          EOF

          cat > src/features/workspace/WorkspacePage.tsx <<'EOF'
          import { useEffect, useState } from 'react'
          import {
            createScadaWork,
            listScadaWorks,
            type ScadaWorkSummary,
          } from '../scada-works/storage'
          import {
            listComponentDefinitions,
            type ComponentDefinition,
          } from '../component-library/storage'
          import './workspace.css'

          type WorkspaceModule = 'works' | 'components'

          function formatUpdatedAt(value: string) {
            const date = new Date(value)

            if (Number.isNaN(date.getTime())) {
              return '未知时间'
            }

            return new Intl.DateTimeFormat('zh-CN', {
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            }).format(date)
          }

          function buildHashUrl(path: string) {
            return `${window.location.href.split('#')[0]}#${path}`
          }

          export function WorkspacePage() {
            const [activeModule, setActiveModule] = useState<WorkspaceModule>('works')
            const [works, setWorks] = useState<ScadaWorkSummary[]>(() => listScadaWorks())
            const [components, setComponents] = useState<ComponentDefinition[]>(() =>
              listComponentDefinitions(),
            )

            useEffect(() => {
              const refresh = () => {
                setWorks(listScadaWorks())
                setComponents(listComponentDefinitions())
              }

              window.addEventListener('focus', refresh)
              return () => window.removeEventListener('focus', refresh)
            }, [])

            function openWork(workId: string) {
              window.open(buildHashUrl(`/scada/${encodeURIComponent(workId)}`), '_blank', 'noopener,noreferrer')
            }

            function createWork() {
              const work = createScadaWork()
              setWorks(listScadaWorks())
              openWork(work.id)
            }

            function openComponent(componentId: string) {
              window.location.hash = `#/components/${encodeURIComponent(componentId)}`
            }

            function createComponent() {
              window.location.hash = '#/components/new'
            }

            return (
              <div className="workspace-shell">
                <aside className="workspace-sidebar">
                  <div className="workspace-brand">
                    <span className="workspace-brand-mark" aria-hidden="true">◆</span>
                    <div>
                      <strong>SCADA Studio</strong>
                      <span>工程工作台</span>
                    </div>
                  </div>

                  <nav className="workspace-nav" aria-label="主模块">
                    <button
                      type="button"
                      className={activeModule === 'works' ? 'active' : ''}
                      onClick={() => setActiveModule('works')}
                    >
                      <span className="workspace-nav-icon">▦</span>
                      <span>
                        <strong>SCADA 作品</strong>
                        <small>设计、预览与管理场景</small>
                      </span>
                    </button>
                    <button
                      type="button"
                      className={activeModule === 'components' ? 'active' : ''}
                      onClick={() => setActiveModule('components')}
                    >
                      <span className="workspace-nav-icon">◇</span>
                      <span>
                        <strong>组件库开发</strong>
                        <small>开发与维护可复用组件</small>
                      </span>
                    </button>
                  </nav>
                </aside>

                <main className="workspace-main">
                  {activeModule === 'works' ? (
                    <section className="workspace-section">
                      <header className="workspace-section-header">
                        <div>
                          <span className="workspace-eyebrow">SCADA WORKS</span>
                          <h1>SCADA 作品</h1>
                          <p>每个作品拥有独立场景存储，编辑器会在新的浏览器标签页中打开。</p>
                        </div>
                        <button className="workspace-primary-button" type="button" onClick={createWork}>
                          + 新建作品
                        </button>
                      </header>

                      <div className="workspace-card-grid">
                        {works.map((work) => (
                          <article className="workspace-card" key={work.id}>
                            <div className="work-preview" aria-hidden="true">
                              <span>{work.width} × {work.height}</span>
                              <div className="work-preview-canvas">
                                <i />
                                <i />
                                <i />
                              </div>
                            </div>
                            <div className="workspace-card-body">
                              <div className="workspace-card-title-row">
                                <h2>{work.name}</h2>
                                <span className="workspace-badge">SCADA</span>
                              </div>
                              <div className="workspace-card-meta">
                                <span>{work.nodeCount} 个组件</span>
                                <span>{work.connectionCount} 条连线</span>
                                <span>更新 {formatUpdatedAt(work.updatedAt)}</span>
                              </div>
                              <button
                                type="button"
                                className="workspace-card-action"
                                onClick={() => openWork(work.id)}
                              >
                                新标签页编辑 ↗
                              </button>
                            </div>
                          </article>
                        ))}
                      </div>
                    </section>
                  ) : (
                    <section className="workspace-section">
                      <header className="workspace-section-header">
                        <div>
                          <span className="workspace-eyebrow">COMPONENT LIBRARY</span>
                          <h1>组件库开发</h1>
                          <p>组件定义与 SCADA 作品解耦，集中维护类型、尺寸、说明和渲染实现草稿。</p>
                        </div>
                        <button className="workspace-primary-button" type="button" onClick={createComponent}>
                          + 新建组件
                        </button>
                      </header>

                      <div className="component-table" role="table" aria-label="组件列表">
                        <div className="component-table-row component-table-head" role="row">
                          <span>组件</span>
                          <span>类型</span>
                          <span>分类</span>
                          <span>状态</span>
                          <span>操作</span>
                        </div>
                        {components.map((component) => (
                          <div className="component-table-row" role="row" key={component.id}>
                            <div className="component-name-cell">
                              <span className="component-avatar">{component.name.slice(0, 1).toUpperCase()}</span>
                              <span>
                                <strong>{component.name}</strong>
                                <small>{component.defaultWidth} × {component.defaultHeight}</small>
                              </span>
                            </div>
                            <code>{component.type}</code>
                            <span>{component.category}</span>
                            <span>
                              <span className={`workspace-badge ${component.status}`}>
                                {component.builtIn ? '内置' : component.status === 'ready' ? '可用' : '草稿'}
                              </span>
                            </span>
                            <button
                              type="button"
                              className="component-edit-button"
                              onClick={() => openComponent(component.id)}
                            >
                              {component.builtIn ? '查看' : '编辑'}
                            </button>
                          </div>
                        ))}
                      </div>
                    </section>
                  )}
                </main>
              </div>
            )
          }
          EOF

