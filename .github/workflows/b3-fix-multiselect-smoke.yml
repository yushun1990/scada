name: Patch B3 multiselect smoke

on:
  push:
    branches:
      - fix/ui-b3-mode-selection
    paths:
      - .github/workflows/b3-fix-multiselect-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-b3-mode-selection
      - name: Use real Shift keyboard modifier for Konva selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pages-editor-mode-selection-smoke.mjs')
          text = path.read_text()
          old = '''async function clickSceneNode(sceneNode, toClient, modifiers = {}) {
  const center = toClient(
    sceneNode.transform.x + sceneNode.transform.width / 2,
    sceneNode.transform.y + sceneNode.transform.height / 2,
  )
  await page.mouse.click(center.x, center.y, modifiers)
}
'''
          new = '''async function clickSceneNode(sceneNode, toClient, { shift = false } = {}) {
  const center = toClient(
    sceneNode.transform.x + sceneNode.transform.width / 2,
    sceneNode.transform.y + sceneNode.transform.height / 2,
  )
  if (shift) await page.keyboard.down('Shift')
  try {
    await page.mouse.click(center.x, center.y)
  } finally {
    if (shift) await page.keyboard.up('Shift')
  }
}
'''
          if old not in text:
              raise SystemExit('clickSceneNode fixture block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "await clickSceneNode(secondNode, toClient, { modifiers: ['Shift'] })",
              "await clickSceneNode(secondNode, toClient, { shift: true })",
              1,
          )
          path.write_text(text)
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/b3-fix-multiselect-smoke.yml
          git add scripts/pages-editor-mode-selection-smoke.mjs
          git commit -m "test: use real Shift modifier for B3 multiselect"
          git push origin HEAD:fix/ui-b3-mode-selection
