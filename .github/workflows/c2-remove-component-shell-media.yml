name: C2 Remove Component Shell Media

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - scripts/c2-remove-component-shell-media.mjs
      - .github/workflows/c2-remove-component-shell-media.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/c2-remove-component-shell-media.mjs
      - run: |
          rm scripts/c2-remove-component-shell-media.mjs
          rm .github/workflows/c2-remove-component-shell-media.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove remaining component shell media rules"
          git push origin HEAD:refactor/ui-c2-studio-shell
