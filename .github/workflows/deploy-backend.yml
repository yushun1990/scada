name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API image
        run: docker build -f server/Containerfile -t localhost/scada-api:latest server

      - name: Export API image
        run: |
          mkdir -p /tmp/scada-deploy
          docker save localhost/scada-api:latest | gzip -1 > /tmp/scada-deploy/scada-api.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare release directory
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" \
            'mkdir -p /opt/scada/releases /opt/scada/quadlet /opt/scada/scripts'

      - name: Upload release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp -P "$PORT" /tmp/scada-deploy/scada-api.tar.gz "$USER@$HOST:/opt/scada/releases/scada-api.tar.gz"
          scp -P "$PORT" deploy/quadlet/* "$USER@$HOST:/opt/scada/quadlet/"
          scp -P "$PORT" deploy/scripts/deploy.sh "$USER@$HOST:/opt/scada/scripts/deploy.sh"

      - name: Deploy with rootless Podman and Quadlet
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" \
            'chmod +x /opt/scada/scripts/deploy.sh && /opt/scada/scripts/deploy.sh'
