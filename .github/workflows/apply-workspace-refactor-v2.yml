name: Apply workspace refactor v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/workspace-and-component-library
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refactor with strict import cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-workspace-refactor.yml').read_text().splitlines()
          start = workflow.index('      - name: Refactor application structure')
          run_line = next(i for i in range(start, len(workflow)) if workflow[i] == '        run: |')
          end = workflow.index('      - name: Verify refactor', run_line)
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end]))
          Path('/tmp/apply-workspace-refactor.sh').write_text(script + '\n')
          PY

          bash /tmp/apply-workspace-refactor.sh

          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/scada-editor/ScadaEditorPage.tsx')
          text = path.read_text()
          old = '  createDefaultScene,\n'
          assert old in text, 'expected migrated createDefaultScene import'
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Verify refactor
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Commit refactor
        shell: bash
        run: |
          rm .github/workflows/apply-workspace-refactor.yml
          rm .github/workflows/apply-workspace-refactor-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: introduce workspace and component library modules"
          git push origin HEAD:refactor/workspace-and-component-library
