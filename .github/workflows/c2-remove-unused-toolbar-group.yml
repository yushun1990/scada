name: C2 Remove Stale Toolbar Import

on:
  push:
    branches:
      - refactor/ui-c2-studio-shell
    paths:
      - scripts/c2-remove-unused-toolbar-group.mjs
      - .github/workflows/c2-remove-unused-toolbar-group.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-c2-studio-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/c2-remove-unused-toolbar-group.mjs
      - run: |
          rm scripts/c2-remove-unused-toolbar-group.mjs
          rm .github/workflows/c2-remove-unused-toolbar-group.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove stale ToolbarGroup import"
          git push origin HEAD:refactor/ui-c2-studio-shell
